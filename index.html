<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/image/logowbg.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The hero image and all CMS images come from Cloudinary. Opening this
         connection while the JS bundle downloads removes a DNS + TLS round trip
         from the LCP critical path, especially on slow mobile networks. -->
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- Critical CSS: must be inline so the loading skeleton paints from the
         first byte, before the bundled stylesheet arrives. Otherwise the
         browser shows a white page first. -->
    <style>
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
        background: #edebe9;
      }
      .boot {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        width: 100%;
      }
      .boot-bar {
        display: flex;
        align-items: center;
        gap: 16px;
        box-sizing: border-box;
        width: 100%;
        height: 64px;
        padding: 0 16px;
        background: #0c2423;
      }
      .boot-main {
        display: flex;
        flex-direction: column;
        gap: 24px;
        box-sizing: border-box;
        width: 100%;
        max-width: 1280px;
        margin: 0 auto;
        padding: 24px 16px;
        flex: 1;
      }
      .boot-grid3 {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
        width: 100%;
      }
      .boot-cards {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
        width: 100%;
      }
      .boot-b {
        background: rgba(0, 0, 0, 0.1);
        border-radius: 8px;
        animation: bootp 1.4s ease-in-out infinite;
      }
      .boot-b.light {
        background: rgba(255, 255, 255, 0.1);
      }
      .boot-b.round {
        border-radius: 9999px;
      }
      .boot-b.card {
        border-radius: 16px;
      }
      @keyframes bootp {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }
      @media (min-width: 640px) {
        .boot-bar {
          height: 80px;
          padding: 0 40px;
        }
        .boot-grid3 {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .boot-cards {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (min-width: 1024px) {
        .boot-cards {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
    </style>

    <title>Grace Christian Academy</title>
  </head>
  <body>
    <div id="root">
      <!-- Replaced by React on mount. -->
      <div class="boot" aria-hidden="true">
        <div class="boot-bar">
          <div class="boot-b light round" style="width: 36px; height: 36px; flex: none"></div>
          <div class="boot-b light" style="width: 160px; height: 16px"></div>
          <div class="boot-b light" style="width: 96px; height: 16px; margin-left: auto"></div>
        </div>

        <div class="boot-main">
          <div class="boot-grid3">
            <div class="boot-b card" style="height: 160px"></div>
            <div class="boot-b card" style="height: 160px"></div>
            <div class="boot-b card" style="height: 160px"></div>
          </div>

          <div class="boot-b" style="width: 256px; height: 32px"></div>

          <div class="boot-cards">
            <div class="boot-b card" style="height: 320px"></div>
            <div class="boot-b card" style="height: 320px"></div>
            <div class="boot-b card" style="height: 320px"></div>
          </div>

          <div class="boot-b" style="width: 100%; height: 16px"></div>
          <div class="boot-b" style="width: 83%; height: 16px"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
